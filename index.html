<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fulcrum-site</title>
  </head>
  <body>
    <!--
      Netlify Forms (build-time detection for Vite + React):
      Every field name below must match what the React app POSTs (urlencoded or multipart).
    -->
    <div style="display: none" aria-hidden="true">
      <form
        name="consultation-request"
        method="post"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="consultation-request" />
        <input name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="company" />
        <input type="text" name="website" />
        <input type="text" name="service" />
        <input type="text" name="budget" />
        <input type="text" name="timeline" />
        <textarea name="goals"></textarea>
        <input type="text" name="consent" />
        <input type="text" name="sourceUrl" />
      </form>
      <form name="action-roi" method="post" data-netlify="true" data-netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="action-roi" />
        <input name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="company" />
        <input type="text" name="icv" />
        <input type="text" name="ltv" />
        <input type="text" name="grossMargin" />
        <input type="text" name="closeRate" />
        <input type="text" name="notes" />
        <input type="text" name="service" />
        <input type="text" name="sourceUrl" />
      </form>
      <form
        name="academy-application"
        method="post"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
        enctype="multipart/form-data"
      >
        <input type="hidden" name="form-name" value="academy-application" />
        <input name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="status" />
        <textarea name="why"></textarea>
        <input type="file" name="resume" />
        <input type="text" name="sourceUrl" />
      </form>
      <form name="contact" method="post" data-netlify="true" data-netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact" />
        <input name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <input type="text" name="sourceUrl" />
      </form>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
